name: Visual preview acceptance
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p out && node src/validate-browser.mjs && node src/validate-composition.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-preview-evidence
          path: out/
          retention-days: 7
