name: Visual preview acceptance
on:
  push:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Optional public preview URL to verify
        required: false
        type: string
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p out && node src/validate-studio.mjs "$REVIEW_URL"
        env:
          REVIEW_URL: ${{ inputs.preview_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-studio-evidence
          path: out/
          retention-days: 7
